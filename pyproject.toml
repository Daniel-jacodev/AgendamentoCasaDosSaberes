[project]
name = "agendamentocasadossaberes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.2",
    "pytest-asyncio>=1.4.0",
    "sqlalchemy>=2.1.4",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
run = 'fastapi dev app/main.py'
format = 'ruff check --select I --fix . && ruff format .'
test = 'pytest -s -x --cov=app -vv'

[tool.ruff]
extend-exclude = ['database']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'W', 'PL', 'PT', 'FAST']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = '.'
addopts = '-p no:warnings'
asyncio_default_fixture_loop_scope = 'function'

[tool.coverage.run]
concurrency = ['thread', 'greenlet']
omit = [
    "*/__init__.py"
]
